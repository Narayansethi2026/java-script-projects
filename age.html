<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIRTH Calculator</title>
     <link rel="stylesheet" href="age.css">
</head>
<body>
    <div class="card">
        <h2>Birth Calculator</h2>

        <div class="input-group">
            <label for="birthDatetime">Select Birth Date & Time:</label>
            <input type="datetime-local" id="birthDatetime">
        </div>

        <button onclick="calculateBirthDetails()">Calculate</button>

        <div class="result-box" id="resultBox">
            <p>Day of Birth: <span id="dayName"></span></p>
            <p>Exact Age: <span id="ageText"></span></p>
            <p>Total Time Lived: <span id="totalHours"></span></p>
        </div>
    </div>
  <script src="age.js"></script>  
</body>
</html>
