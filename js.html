<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="js.css">
    <title>DGVCL bill calculate</title>

</head>
<div class="card">
    <h2>DGVCL Calculate</h2>
    <div class="input-group">
        <label for="units">enter total untis</label>
        <input type="number" id="units" placeholder="e.g 150">
    </div>
    <button onclick="calc()">calculate</button>

    <div class="result-box">
        <h3 id="calc()">calculate bill</h3>
    </div>
    <div class="result-box">
        <h3 id="res">Total Bill: ₹0.00</h3>
    </div>
</div>


<h3 id="res"></h3>






<script src="js.js"></script>
</body>

</html>
