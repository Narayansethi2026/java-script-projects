<!DOCTYPE html>
<html>
<head>
    <title>Bus LED Panel - Fixed Bus No + Scrolling Route</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        .panel {
            background: #000;
            border: 6px solid #2a2a2a;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.5),
                        inset 0 0 20px rgba(255, 140, 0, 0.1);
            width: 650px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* LED dots background effect */
        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,140,0,0.08) 1px, transparent 1px);
            background-size: 6px 6px;
            pointer-events: none;
        }

        /* FIXED Bus Number (left side) */
        .bus-number {
            color: #ff8800;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff8800, 0 0 20px #ff5500, 0 0 30px #ff3300;
            padding-right: 15px;
            white-space: nowrap;
            z-index: 2;
            position: relative;
        }

        /* Separator line */
        .separator {
            width: 3px;
            height: 55px;
            background: linear-gradient(to bottom, transparent, #ff8800, transparent);
            box-shadow: 0 0 12px #ff8800;
            margin-right: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        /* Scrolling text container */
        .scroll-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 55px;
        }

        .scroll-text {
            color: #ff8800;
            font-size: 40px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff8800, 0 0 20px #ff5500;
            animation: scroll-left 18s linear infinite;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes scroll-left {
            0%   { left: 100%; }
            100% { left: -100%; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <!-- FIXED Bus Number -->
        <div class="bus-number">118</div>

        <!-- Separator Line -->
        <div class="separator"></div>

        <!-- Scrolling Route Text -->
        <div class="scroll-container">
            <div class="scroll-text">SURAT RLWY STATION TO SAYAN RLWY STATION</div>
        </div>
    </div>
</body>
</html>
